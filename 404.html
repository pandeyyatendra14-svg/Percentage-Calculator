<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Quick Percentage Calculator</title>
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://quickpercentagecalculator.com/404.html">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f1f5f9; --text-main: #1e293b; --text-muted: #64748b; --card-bg: #ffffff; --border: #e2e8f0; --blue-main: #2563eb; --blue-hover: #1d4ed8; --blue-light: #eff6ff; --blue-text: #1e40af; }
        .dark { --bg: #020617; --text-main: #f1f5f9; --text-muted: #94a3b8; --card-bg: #0f172a; --border: #1e293b; --blue-light: #172554; --blue-text: #60a5fa; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; transition: 0.3s; }
        .card { background: var(--card-bg); border: 2px solid var(--blue-main); border-radius: 16px; padding: 40px 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
        h1 { font-size: 60px; color: var(--blue-main); margin-bottom: 10px; font-weight: 800; line-height: 1; }
        h2 { font-size: 22px; margin-bottom: 15px; font-weight: 700; color: var(--text-main); }
        p { font-size: 14px; color: var(--text-muted); margin-bottom: 25px; line-height: 1.6; }
        .btn { background: var(--blue-main); color: white; text-decoration: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; display: inline-block; margin: 5px; transition: 0.2s; }
        .btn:hover { background: var(--blue-hover); }
        .btn-secondary { background: transparent; color: var(--blue-main); border: 2px solid var(--blue-main); }
        .btn-secondary:hover { background: var(--blue-light); }
    </style>
</head>
<body>
    <div class="card">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The page you are looking for doesn't exist or was moved.</p>
        <a href="index.html" class="btn">🏠 Go to Homepage</a>
        <a href="blog.html" class="btn btn-secondary">Read Blog</a>
    </div>
</body>
</html>
